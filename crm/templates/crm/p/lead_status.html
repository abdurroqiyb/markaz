<form method="post" action="{% url 'lead_status' l.pk %}" class="inl" data-autosubmit>{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><select class="pillsel" name="status" aria-label="Holati">{% for k, t in statuses %}<option value="{{ k }}"{% if l.status == k %} selected{% endif %}>{{ t }}</option>{% endfor %}</select><noscript><button class="btn sm">OK</button></noscript></form>
