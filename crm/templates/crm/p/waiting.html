<section class="panel"><h2>Kutish ro'yxati</h2>{% for x in waiting %}<div class="mini"><span>{{ x.s.name }}<br><small class="mut">{{ x.g.name|default:"Guruhsiz" }}</small></span>{% if x.free %}<form method="post" action="{% url 'student_activate' x.s.pk %}" class="inl">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="btn sm primary">Joy bor: qo'shish</button></form>{% else %}<span class="pill mute">To'la</span>{% endif %}</div>{% empty %}<p class="mut m0">Guruh to'lgan bo'lsa, talabani "Kutmoqda" holatida qo'shing, joy bo'shaganda shu yerda chiqadi.</p>{% endfor %}</section>
