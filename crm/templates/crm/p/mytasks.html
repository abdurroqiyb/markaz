<section class="panel"><div class="head" style="margin-bottom:12px"><h2 class="m0">Mening vazifalarim</h2><a class="btn sm" href="{% url 'vazifalar' %}">Hammasi</a></div>{% for t in my_tasks %}<div class="mini"><span>{{ t.title }}</span>{% if t.due %}<span class="pill {% if t.due < d.TODAY %}bad{% elif t.due == d.TODAY %}warn{% else %}info{% endif %}">{{ t.due|date:"Y-m-d" }}</span>{% endif %}</div>{% empty %}<p class="mut m0">Ochiq vazifa yo'q.</p>{% endfor %}</section>
