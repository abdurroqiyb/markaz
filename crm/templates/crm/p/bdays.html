<section class="panel"><h2>Tug'ilgan kunlar</h2>{% for x in bdays %}<div class="mini"><span>{{ x.s.name }}<br><small class="mut">{{ x.age }} yoshga to'ladi · {{ x.s.birth_date|date:"m-d" }}</small></span><span class="rowact"><span class="pill {% if x.diff == 0 %}good{% else %}info{% endif %}">{% if x.diff == 0 %}Bugun{% else %}{{ x.diff }} kundan keyin{% endif %}</span><button type="button" class="btn sm ghost" data-copy-text="{{ x.txt }}">Tabrik</button></span></div>{% empty %}<p class="mut m0">Yaqin 7 kunda tug'ilgan kun yo'q. Talaba kartasiga tug'ilgan sanani kiriting.</p>{% endfor %}</section>
