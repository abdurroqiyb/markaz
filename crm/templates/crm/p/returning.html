<section class="panel"><h2>Qaytishi kerak</h2>{% for s in returning %}<div class="mini"><span>{{ s.name }}<br><small class="mut">Qaytish sanasi: {{ s.return_date|date:"Y-m-d" }}</small></span><form method="post" action="{% url 'student_activate' s.pk %}" class="inl">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="btn sm primary">Faollashtirish</button></form></div>{% empty %}<p class="mut m0">{% if paused %}{{ paused }} ta muzlatilgan talaba bor, qaytish sanasi hali yaqin emas.{% else %}Muzlatilgan talaba yo'q.{% endif %}</p>{% endfor %}</section>
